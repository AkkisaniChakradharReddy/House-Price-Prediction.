
name: Docker Build and Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: house-price-app
      IMAGE_TAG: ${{ github.sha }}
      HEALTH_URL: http://localhost:8501/_stcore/health

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Verify Docker Image
        run: |
          docker image inspect $IMAGE_NAME:$IMAGE_TAG > /dev/null
          docker images $IMAGE_NAME

      - name: Test ML Model Inside Container
        run: docker run --rm $IMAGE_NAME:$IMAGE_TAG python test_model.py

      - name: Run Application Container
        run: |
          docker run -d -p 8501:8501 \
            --name test-container $IMAGE_NAME:$IMAGE_TAG

      - name: Application Health Check
        run: |
          for i in $(seq 1 30); do
            if curl -fs $HEALTH_URL | grep -q "ok"; then
              echo "Application is running and healthy."
              exit 0
            fi
            echo "Waiting for application to start... ($i/30)"
            sleep 2
          done

          echo "Application did not start."
          docker logs test-container
          exit 1

      - name: Clean Up
        if: always()
        run: docker rm -f test-container || true

      - name: Build Validation Completed
        run: echo "Docker image built and validated successfully!"
